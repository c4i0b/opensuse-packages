name: push-to-obs

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'README*'
      - 'LICENSE*'
      - '.gitignore'
      - 'renovate.json'
  workflow_dispatch:
    inputs:
      packages:
        description: "Comma-separated <category>/<name> packages to push (blank = auto-detect from push)"
        required: false
        default: ""

run-name: "push-to-obs - ${{ github.event.head_commit.message || github.event.inputs.packages || 'manual' }}"

permissions:
  contents: read

concurrency:
  group: push-to-obs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Resolve changed packages
        id: resolve
        env:
          INPUT_PACKAGES: ${{ github.event.inputs.packages }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          empty_tree="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          zero="0000000000000000000000000000000000000000"

          detect() {
            git diff --name-only --diff-filter=ACMR "$1" "$2" \
              | grep -E '^[^./][^/]*/[^./][^/]*/' \
              | grep -vE '/(VERSION|fetch\.sh|bump\.sh|BIN|\.obsignore)$' \
              | grep -vE '\.(tar\.gz|zip)$' \
              | cut -d/ -f1-2 | sort -u \
              | while IFS= read -r p; do [ -d "$p" ] && echo "$p"; done \
              | paste -sd, - || true
          }

          if [ -n "${INPUT_PACKAGES:-}" ]; then
            pkgs="$INPUT_PACKAGES"
          else
            after="${AFTER:-${GITHUB_SHA}}"
            before="${BEFORE:-}"
            if [ -z "$before" ] || [ "$before" = "$zero" ]; then
              if git rev-parse --verify --quiet 'HEAD~1' >/dev/null; then
                pkgs="$(detect 'HEAD~1' "$after")"
              else
                pkgs="$(detect "$empty_tree" "$after")"
              fi
            else
              pkgs="$(detect "$before" "$after")"
            fi
          fi
          pkgs="${pkgs// /}"
          # Drop source builds (superfile/television): their vendor tarball is
          # gitignored and only exists locally — a CI push would rsync without it
          # and osc ci would delete it from OBS, breaking the build. They are
          # bumped + pushed manually via bump.sh/fetch.sh/just push (mirrors the
          # Renovate exclusion).
          kept=""
          IFS=',' read -ra arr <<< "$pkgs"
          for p in "${arr[@]}"; do
            [ -n "$p" ] || continue
            case "$p" in
              packages/superfile|packages/television)
                echo "skip $p (source build — vendor tarball is local-only; push with just push)"
                ;;
              *)
                kept+="${kept:+,}$p"
                ;;
            esac
          done
          pkgs="$kept"
          echo "packages=${pkgs}" >> "$GITHUB_OUTPUT"
          echo "Resolved: ${pkgs:-<none>}"

      - name: Setup Python
        if: steps.resolve.outputs.packages != ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: .github/requirements-osc.txt

      - name: Install osc
        if: steps.resolve.outputs.packages != ''
        run: pip install -r .github/requirements-osc.txt

      - name: Configure osc
        if: steps.resolve.outputs.packages != ''
        env:
          OBS_USER: ${{ secrets.OBS_USER }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.oscrc
          {
            echo "[general]"
            echo "apiurl = https://api.opensuse.org"
            echo "[https://api.opensuse.org]"
            echo "user = ${OBS_USER}"
            echo "pass = ${OBS_PASSWORD}"
          } > ~/.oscrc

      - name: Push packages to OBS
        id: doit
        if: steps.resolve.outputs.packages != ''
        timeout-minutes: 5
        env:
          OBS_API: "https://api.opensuse.org"
          OBS_PROJECT: "home:${{ secrets.OBS_USER }}"
          OBS_REPO: "opensuse_tumbleweed"
          PACKAGES: ${{ steps.resolve.outputs.packages }}
        run: |
          set -euo pipefail

          osc_meta() { osc -A "$OBS_API" "$@"; }

          ensure_project() {
            if ! osc_meta meta prj "$OBS_PROJECT" >/dev/null 2>&1; then
              arches=""
              for a in x86_64 aarch64; do
                [ -n "$arches" ] && arches+="\n"
                arches+="    <arch>$a</arch>"
              done
              tmp="$(mktemp)"
              sed -e "s|@@PROJECT@@|${OBS_PROJECT}|g" \
                  -e "s|@@REPO@@|${OBS_REPO}|g" \
                  -e "s|@@ARCHES@@|${arches}|g" \
                  "$GITHUB_WORKSPACE/_project.meta.xml" > "$tmp"
              osc_meta meta prj -F "$tmp" "$OBS_PROJECT"
              rm -f "$tmp"
            fi
          }

          ensure_package() {
            local name="$1" spec="$2"
            if ! osc_meta meta pkg "$OBS_PROJECT" "$name" >/dev/null 2>&1; then
              summary="$(awk '/^Summary:/ {sub(/^Summary:[ \t]*/,""); print; exit}' "$spec")"
              desc="$(awk '/^%description/{f=1;next}/^%/{f=0}f&&NF{print}' "$spec" | head -8)"
              esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
              tmp="$(mktemp)"
              {
                echo "<package name=\"${name}\" project=\"${OBS_PROJECT}\">"
                printf '  <title>%s</title>\n' "$(printf '%s' "$summary" | esc)"
                printf '  <description>%s</description>\n' "$(printf '%s' "$desc" | esc)"
                echo "</package>"
              } > "$tmp"
              osc_meta meta pkg -F "$tmp" "$OBS_PROJECT" "$name"
              rm -f "$tmp"
            fi
          }

          pushed=()
          IFS=',' read -ra list <<< "$PACKAGES"
          for pkg in "${list[@]}"; do
            [ -n "$pkg" ] || continue
            name="${pkg##*/}"
            src="$GITHUB_WORKSPACE/$pkg"
            dest="$GITHUB_WORKSPACE/.osc-work/$name"

            spec="$(ls "$src"/*.spec 2>/dev/null | head -1)"
            [ -n "$spec" ] || { echo "no .spec in $pkg" >&2; exit 1; }
            awk '/^Version:/{ok=1} END{exit ok?0:1}' "$spec" \
              || { echo "missing Version: in $spec" >&2; exit 1; }

            ensure_project
            ensure_package "$name" "$spec"

            mkdir -p "$dest"
            if [ -d "$dest/.osc" ]; then
              (cd "$dest" && osc_meta up)
            else
              osc_meta co "$OBS_PROJECT" "$name" -o "$dest"
            fi

            if [ -x "$src/bump.sh" ]; then
              ver="$(awk '/^Version:/{print $2; exit}' "$spec")"
              "$src/bump.sh" "$ver" || true
            fi

            ex=(--exclude='.osc' --exclude='fetch.sh' --exclude='bump.sh' --exclude='BIN' --include='vendor.*' --exclude='*.tar.gz' --exclude='*.zip')
            [ -f "$src/.obsignore" ] && ex+=(--exclude-from="$src/.obsignore")
            rsync -a --delete "${ex[@]}" "$src/" "$dest/"
            (cd "$dest" && osc_meta addremove && osc_meta st)
            (cd "$dest" && osc_meta ci -m "ci: update $pkg")
            pushed+=("$pkg")
          done
          printf 'pushed=%s\n' "$(IFS=,; echo "${pushed[*]}")" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          PACKAGES: ${{ steps.resolve.outputs.packages }}
          PUSHED: ${{ steps.doit.outputs.pushed }}
        run: |
          {
            echo "## push-to-obs"
            echo "**Detected:** ${PACKAGES:-none}"
            echo "**Pushed:** ${PUSHED:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
