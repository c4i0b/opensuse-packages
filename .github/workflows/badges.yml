name: badges

on:
  # ~1h20 after each autoupdate slot (23 x 1-21/4), when most OBS builds
  # have finished; in-flight ones show yellow with the last built version
  schedule:
    - cron: "43 2,6,10,14,18,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # `bash <script>` instead of direct exec: immune to a lost +x bit
      # (red: both scheduled runs died with exit 126 on mode 644)
      - run: bash tools/update-badges.sh
        env:
          OBS_USER: ${{ secrets.OBS_USER }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
      # [skip ci] keeps the push from re-triggering validate; badge
      # commits never touch packages/, so push-to-obs resolves nothing
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges README.md
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -qm "chore(badges): refresh [skip ci]"
          git push origin main || (sleep 15; git pull --rebase -X theirs origin main && git push origin main)
