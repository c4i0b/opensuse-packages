name: validate-bump

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'

permissions:
  contents: read

jobs:
  validate-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: resolve
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          pkgs="$(git diff --name-only --diff-filter=ACMR "$base" "HEAD" \
            | grep -E '^[^./][^/]*/[^./][^/]*/' \
            | grep -vE '/(fetch\.sh|bump\.sh|BIN|\.obsignore)$' \
            | grep -vE '\.(tar\.gz|tar\.zst|zip)$' \
            | cut -d/ -f1-2 | sort -u \
            | while IFS= read -r p; do [ -d "$p" ] && echo "$p"; done \
            | paste -sd, - || true)"
          echo "packages=${pkgs}" >> "$GITHUB_OUTPUT"
          echo "Detected: ${pkgs:-<none>}"

      - name: Validate version + upstream asset for each package
        if: steps.resolve.outputs.packages != ''
        env:
          PACKAGES: ${{ steps.resolve.outputs.packages }}
        run: |
          python3 - <<'PY'
          import glob
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          pkgs = [p for p in os.environ["PACKAGES"].split(",") if p]
          failures = []

          for pkg in pkgs:
              specs = glob.glob(os.path.join(pkg, "*.spec"))
              svc = os.path.join(pkg, "_service")
              if not specs:
                  failures.append(f"{pkg}: no spec")
                  continue
              if not os.path.isfile(svc):
                  failures.append(f"{pkg}: no _service (a bump must update it)")
                  continue

              ver = None
              for line in open(specs[0]):
                  m = re.match(r"^Version:\s*(\S+)", line)
                  if m:
                      ver = m.group(1)
                      break
              if not ver:
                  failures.append(f"{pkg}: no Version in {specs[0]}")
                  continue

              xml = open(svc).read()
              def param(name):
                  m = re.search(r'<param name="%s">([^<]*)</param>' % name, xml)
                  return m.group(1) if m else None
              url = "".join(x for x in [param("protocol"), "://", param("host"), param("path")] if x)
              if not url.startswith(("http://", "https://")):
                  failures.append(f"{pkg}: could not parse _service download URL")
                  continue

              if not re.search(r"(^|[/_.-])v?" + re.escape(ver) + r"([/_.-]|$)", url):
                  failures.append(f"{pkg}: _service URL ({url}) does not reference version {ver}")

              try:
                  req = urllib.request.Request(url, method="HEAD")
                  with urllib.request.urlopen(req, timeout=30) as r:
                      code = r.status
              except urllib.error.HTTPError as e:
                  code = e.code
              except Exception as e:
                  failures.append(f"{pkg}: could not HEAD {url}: {e}")
                  continue
              if not (200 <= code < 400):
                  failures.append(f"{pkg}: HEAD {url} -> HTTP {code}")
              print(f"{pkg}: Version {ver}, upstream asset HTTP {code}")

          if failures:
              print("FAILURES:")
              for f in failures:
                  print(" -", f)
              sys.exit(1)
          print(f"OK: {len(pkgs)} package(s) validated")
          PY
