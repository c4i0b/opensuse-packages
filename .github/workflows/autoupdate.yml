name: autoupdate

on:
  schedule:
    - cron: "23 1-21/4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# serializes manual x delayed-schedule overlaps; idempotent, so the newest
# run may cancel an in-flight one
concurrency:
  group: autoupdate
  cancel-in-progress: true

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # `bash <script>` instead of direct exec: immune to a lost +x bit
      - run: bash .github/scripts/autoupdate.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # retry once on a lost race (concurrent run pushed first). Commits by
      # GITHUB_TOKEN fire no `push` events: push-to-obs picks the bumps up
      # via its workflow_run trigger on this workflow completing.
      - run: git push origin main || (sleep 15; git pull --rebase origin main && git push origin main)
