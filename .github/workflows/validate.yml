name: validate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # PRs diff against the base branch; pushes against the previous
          # tip (zero sha on the very first push / force-push orphans —
          # treat as none; the push-to-obs resolver has the same fallback)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE"
          else
            base=""
          fi
          if [ -z "$base" ]; then
            pkgs=""
          else
            pkgs="$(git diff --name-only --diff-filter=ACMR "$base" "HEAD" \
              | grep -E '^packages/[^/]+/' \
              | grep -vE '/(fetch\.sh|bump\.sh|BIN|\.obsignore)$' \
              | grep -vE '\.(tar\.gz|tar\.zst|zip)$' \
              | cut -d/ -f1-2 | sort -u \
              | while IFS= read -r p; do [ -d "$p" ] && echo "$p"; done \
              | paste -sd, - || true)"
          fi
          echo "Detected: ${pkgs:-<none>}"
          echo "packages=${pkgs}" >> "$GITHUB_OUTPUT"
          echo "Detected: ${pkgs:-<none>}"

      - name: Validate version + upstream asset for each package
        if: steps.resolve.outputs.packages != ''
        env:
          PACKAGES: ${{ steps.resolve.outputs.packages }}
        # shared with autoupdate.yml's in-job bump gate (one definition,
        # two callers)
        run: python3 .github/scripts/validate-packages.py
