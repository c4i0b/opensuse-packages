name: validate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: resolve
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          pkgs="$(git diff --name-only --diff-filter=ACMR "$base" "HEAD" \
            | grep -E '^packages/[^/]+/' \
            | grep -vE '/(fetch\.sh|bump\.sh|BIN|\.obsignore)$' \
            | grep -vE '\.(tar\.gz|tar\.zst|zip)$' \
            | cut -d/ -f1-2 | sort -u \
            | while IFS= read -r p; do [ -d "$p" ] && echo "$p"; done \
            | paste -sd, - || true)"
          echo "packages=${pkgs}" >> "$GITHUB_OUTPUT"
          echo "Detected: ${pkgs:-<none>}"

      - name: Validate version + upstream asset for each package
        if: steps.resolve.outputs.packages != ''
        env:
          PACKAGES: ${{ steps.resolve.outputs.packages }}
        # shared with autoupdate.yml's in-job bump gate (one definition,
        # two callers)
        run: python3 .github/scripts/validate-packages.py
